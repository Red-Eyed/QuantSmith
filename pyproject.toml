[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantsmith"
version = "0.8.4"
description = "Composable post-training quantization with explicit plans"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{name = "Vadym Stupakov", email = "vadim.stupakov@gmail.com"}]
dependencies = ["numpy>=2", "onnx>=1.17", "onnxruntime>=1.20", "pydantic>=2"]

[project.optional-dependencies]
qdrop = ["torch>=2.6"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16",
    "pyrefly>=1.3",
    "pytest-xdist>=3.8.0",
]
examples = ["torch>=2.6", "torchvision>=0.21", "onnxscript>=0.3", "pydantic-settings>=2.7", "rich>=13", "pillow>=11", "scikit-learn>=1.6", "stackformers>=4.6,<4.7"]

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]
