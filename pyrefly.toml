preset = "strict"
search-path = ["."]
project-includes = ["src", "tests", "examples"]
project-excludes = ["tests/typecheck/invalid"]
python-version = "3.11"

[errors]
explicit-any = true
implicit-any = true
no-any-return = true
unannotated-return = true
unannotated-parameter = true
unused-ignore = true
